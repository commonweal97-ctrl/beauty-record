name: beauty_record
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+21

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  logger: ^2.5.0
  
  flutter_svg: ^2.0.9
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  url_launcher: ^6.3.1
  local_auth: ^3.0.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  intl: ^0.20.2
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0
  fl_chart: ^1.2.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  connectivity_plus: ^6.1.5
  provider: ^6.1.1
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: Inter
      fonts:
        - asset: lib/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: lib/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: lib/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/Inter_18pt-Bold.ttf
          weight: 700
  
